<div class="mk-field{% if field.errors %} has-error{% endif %}{% if wide %} mk-field--wide{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
    <label class="mk-check">{{ field }} <span>{{ field.label }}</span></label>
    {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="mk-required" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% endif %}
    {% if field.help_text %}<small class="mk-help">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<small class="mk-error"><i class="fas fa-circle-exclamation" aria-hidden="true"></i> {{ error }}</small>{% endfor %}
</div>
